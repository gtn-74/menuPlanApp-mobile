name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 同一 ref の古い実行はキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# カバレッジを PR にコメントするため
permissions:
  contents: read
  pull-requests: write

jobs:
  # 速く落ちやすいゲート（型・lint・単体・コンポーネント）
  check:
    name: Typecheck / Lint / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo / TS7)
        run: pnpm run typecheck

      - name: Lint & format (Biome)
        run: pnpm exec biome ci .

      - name: Unit tests + coverage (Vitest)
        run: pnpm run test:ci

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      # Codecov に lcov をアップロード（push/PR とも。履歴・components・trend 用）
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Component tests (jest-expo + RNTL)
        run: pnpm run test:components

  # ビルドが通るか（web バンドル / Storybook）
  build:
    name: Build (web export / Storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web bundle (expo export)
        run: pnpm exec expo export --platform web

      - name: Build Storybook
        run: pnpm run build-storybook
